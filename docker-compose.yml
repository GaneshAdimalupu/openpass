services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: openevents
      POSTGRES_PASSWORD: openevents
      POSTGRES_DB: openevents
    ports:
      - "5434:5432"
    volumes:
      - openevents_pgdata:/var/lib/postgresql/data

volumes:
  openevents_pgdata:
