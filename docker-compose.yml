services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: makemyevent
      POSTGRES_PASSWORD: makemyevent
      POSTGRES_DB: makemyevent
    ports:
      - "5434:5432"
    volumes:
      - makemyevent_pgdata:/var/lib/postgresql/data

volumes:
  makemyevent_pgdata:
